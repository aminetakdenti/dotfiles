set -g mouse on
set -g extended-keys on

unbind C-b

set-option -g prefix C-a

bind-key C-a send-prefix



set -g extended-keys-format csi-u

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Switch windows with prefix + Ctrl-l / Ctrl-h
bind C-l next-window
bind C-h previous-window

# Switch panes with prefix + h/j/k/l
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# Enter copy (visual) mode with prefix + Enter
bind Enter copy-mode

# Vi mode in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# kill session
bind X confirm-before -p "Kill Session #S (y/n)" kill-session

# ── Dim unfocused panes ───────────────────────────────────────
# Active pane uses the normal terminal background; inactive panes are
# dimmed to fake an "opacity" effect on the unfocused splits.
set -g window-style 'fg=#808080,bg=#141414'
set -g window-active-style 'fg=default,bg=default'


# ── Plugins ───────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'

# SessionX config
set -g @sessionx-bind 's'
set -g @sessionx-bind-window-mode 'w'

set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_wbg 1             # GitHub / GitLab stats
set -g @tokyo-night-tmux_show_netspeed 1        # network speed
set -g @tokyo-night-tmux_show_battery_widget 1  # battery level
set -g @tokyo-night-tmux_show_music 1           # now playing
set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 1        # machine hostname

# Optional: reorder the right status bar (default order shown)
set -g @tokyo-night-tmux_show_right_widgets "path, git, datetime"

# ── Theme ─────────────────────────────────────────────────────
# source-file ~/my-theme/tmux/onyx-gold.tmux.conf


bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""


# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
